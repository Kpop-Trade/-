name: Restore index.html
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/restore-index.yml"
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore index.html from pre-breakage commit
        run: |
          git checkout 41d7cbe66be5e9e92c490aff6782facf79a0adf1 -- index.html
          git config user.name "Kpop-Trade"
          git config user.email "Kpop-Trade@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "index.html already matches target"
            exit 0
          fi
          git commit -m "restore: index.html to pre-breakage state (41d7cbe)"
          git push
