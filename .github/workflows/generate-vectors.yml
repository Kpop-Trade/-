name: Generate Card Vectors

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-vectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm init -y
          npm install @xenova/transformers sharp

      - name: Generate card_vectors.json from clean folder
        run: |
          node -e '
          const fs = require("fs");
          const path = require("path");
          const { pipeline } = require("@xenova/transformers");

          (async () => {
            const aiSearchCode = fs.readFileSync("ai-search.js", "utf8");
            const modelMatch = aiSearchCode.match(/Xenova\/[a-zA-Z0-9._-]+/);
            const modelName = modelMatch ? modelMatch[0] : "Xenova/dinov2-small";
            console.log("Detected model from ai-search.js:", modelName);

            let isArrayFormat = false;
            if (fs.existsSync("card_vectors.json")) {
              const oldRaw = fs.readFileSync("card_vectors.json", "utf8").trim();
              isArrayFormat = oldRaw.startsWith("[");
            }
            console.log("Format is array:", isArrayFormat);

            const extractor = await pipeline("image-feature-extraction", modelName);
            const cleanDir = path.join(process.cwd(), "clean");
            const files = fs.readdirSync(cleanDir)
              .filter(f => /\.(jpg|jpeg|png|webp)$/i.test(f) && !f.startsWith("._"))
              .sort();

            console.log(`Processing ${files.length} images...`);
            const resultObj = {};
            const resultArr = [];

            for (let i = 0; i < files.length; i++) {
              const file = files[i];
              const id = path.parse(file).name;
              const filePath = path.join(cleanDir, file);
              const output = await extractor(filePath, { pooling: "mean", normalize: true });
              const vector = Array.from(output.data).map(v => Math.round(v * 10000) / 10000);

              if (isArrayFormat) {
                resultArr.push({ id, vector });
              } else {
                resultObj[id] = vector;
              }

              if ((i + 1) % 300 === 0 || i === files.length - 1) {
                console.log(`Progress: ${i + 1} / ${files.length}`);
              }
            }

            const finalData = isArrayFormat ? resultArr : resultObj;
            fs.writeFileSync("card_vectors.json", JSON.stringify(finalData));
            console.log("Successfully saved card_vectors.json");
          })();
          '

      - name: Commit and push card_vectors.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add card_vectors.json
          git diff --staged --quiet || git commit -m "Update card_vectors.json for new 3649 cards"
          git push
