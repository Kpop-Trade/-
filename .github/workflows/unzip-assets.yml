name: Unzip Cards and Clean

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract archives and remove macOS hidden files
        run: |
          mkdir -p _tmp_cards _tmp_clean
          if [ -f cards.zip ]; then
            unzip -q cards.zip -d _tmp_cards
            rm -rf cards
            mkdir -p cards
            find _tmp_cards -type f ! -name "._*" ! -path "*/__MACOSX/*" \( -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.png" -o -iname "*.webp" \) -exec mv {} cards/ \;
            rm -f cards.zip
          fi
          if [ -f clean.zip ]; then
            unzip -q clean.zip -d _tmp_clean
            rm -rf clean
            mkdir -p clean
            find _tmp_clean -type f ! -name "._*" ! -path "*/__MACOSX/*" \( -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.png" -o -iname "*.webp" \) -exec mv {} clean/ \;
            rm -f clean.zip
          fi
          rm -rf _tmp_cards _tmp_clean
          find cards clean -type f \( -name "._*" -o -name ".DS_Store" \) -delete

      - name: Commit and push cleaned files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Remove macOS ._ hidden metadata files from cards and clean"
          git push
