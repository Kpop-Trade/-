<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>card-frame-detector v3 offline test</title>
  <style>
    body { font-family: sans-serif; background: #111; color: #eee; padding: 16px; }
    canvas { max-width: 100%; background: #222; border: 1px solid #333; }
    #log { white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: 12px; }
    .ok { color: #34d399; } .ng { color: #f87171; }
  </style>
</head>
<body>
  <h1>card-frame-detector offline harness</h1>
  <canvas id="src" width="640" height="480"></canvas>
  <pre id="log"></pre>
  <script src="../card-frame-detector.js"></script>
  <script>
    const logEl = document.getElementById("log");
    function log(msg, cls) {
      const line = document.createElement("div");
      if (cls) line.className = cls;
      line.textContent = msg;
      logEl.appendChild(line);
    }
    function assert(cond, msg) {
      if (cond) log("PASS: " + msg, "ok");
      else { log("FAIL: " + msg, "ng"); throw new Error(msg); }
    }

    function drawScene(canvas, opts) {
      const ctx = canvas.getContext("2d");
      const w = canvas.width, h = canvas.height;
      ctx.fillStyle = opts.desk || "#d6c4a8";
      ctx.fillRect(0, 0, w, h);
      for (let i = 0; i < 900; i++) {
        const x = (Math.random() * w) | 0;
        const y = (Math.random() * h) | 0;
        ctx.fillStyle = `rgba(0,0,0,${Math.random() * 0.05})`;
        ctx.fillRect(x, y, 2, 2);
      }
      if (!opts.card) return;
      const { x, y, cw, ch, skew } = opts.card;
      ctx.save();
      ctx.translate(x + cw / 2, y + ch / 2);
      ctx.transform(1, 0, skew || 0, 1, 0, 0);
      ctx.translate(-cw / 2, -ch / 2);
      const g = ctx.createLinearGradient(0, 0, cw, ch);
      g.addColorStop(0, opts.cardColor || "#6b5b95");
      g.addColorStop(1, opts.cardColor2 || "#e8a0bf");
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, cw, ch);
      ctx.strokeStyle = "#1f1f1f";
      ctx.lineWidth = 3;
      ctx.strokeRect(1.5, 1.5, cw - 3, ch - 3);
      ctx.fillStyle = "#f2d6c9";
      ctx.beginPath();
      ctx.ellipse(cw * 0.5, ch * 0.38, cw * 0.22, ch * 0.16, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = opts.hair || "#151515";
      ctx.beginPath();
      ctx.ellipse(cw * 0.5, ch * 0.28, cw * 0.24, ch * 0.12, 0, Math.PI, 0);
      ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,0.88)";
      ctx.fillRect(cw * 0.12, ch * 0.72, cw * 0.76, ch * 0.08);
      // fine detail for focus score
      for (let i = 0; i < 18; i++) {
        ctx.fillStyle = i % 2 ? "#fff" : "#333";
        ctx.fillRect(cw * 0.15 + i * 8, ch * 0.58, 4, 10);
      }
      ctx.restore();
    }

    try {
      const canvas = document.getElementById("src");
      const det = window.__cardFrameDetector;
      assert(!!det, "detector exported");

      const cardW = 220, cardH = Math.round(cardW * 1.545);
      const cx = (640 - cardW) / 2, cy = (480 - cardH) / 2;
      drawScene(canvas, { card: { x: cx, y: cy, cw: cardW, ch: cardH, skew: 0.03 } });

      const guideNorm = { x: 0.18, y: 0.08, w: 0.64, h: 0.84 };
      const hit = det.detectCardQuad(canvas, guideNorm);
      assert(!!hit, "detects upright card");
      assert(hit.corners.length === 4, "returns 4 corners");
      assert(hit.aspect > 1.35 && hit.aspect < 1.75, "aspect in range: " + hit.aspect.toFixed(3));
      assert(hit.confidence > 0.4, "confidence=" + hit.confidence.toFixed(3));
      assert(hit.focus >= 8, "focus score=" + hit.focus.toFixed(2));
      assert(hit.edgeScore >= 10, "edgeScore=" + hit.edgeScore.toFixed(2));

      const xs = hit.corners.map((c) => c.x * 640);
      const ys = hit.corners.map((c) => c.y * 480);
      const minX = Math.min(...xs), maxX = Math.max(...xs);
      const minY = Math.min(...ys), maxY = Math.max(...ys);
      assert(Math.abs(minX - cx) < 45, "left edge near card (" + minX.toFixed(1) + " vs " + cx + ")");
      assert(Math.abs(maxX - (cx + cardW)) < 45, "right edge near card");
      assert(Math.abs(minY - cy) < 50, "top edge near card");
      assert(Math.abs(maxY - (cy + cardH)) < 50, "bottom edge near card");

      // visualize corners
      const ctx = canvas.getContext("2d");
      ctx.strokeStyle = "#10b981";
      ctx.lineWidth = 3;
      ctx.beginPath();
      hit.corners.forEach((c, i) => {
        const x = c.x * 640, y = c.y * 480;
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      });
      ctx.closePath();
      ctx.stroke();

      // empty desk
      drawScene(canvas, {});
      const miss = det.detectCardQuad(canvas, guideNorm);
      assert(!miss, "empty desk rejected");

      // warp
      drawScene(canvas, { card: { x: cx, y: cy, cw: cardW, ch: cardH, skew: 0.05 } });
      const hit2 = det.detectCardQuad(canvas, guideNorm);
      assert(!!hit2, "redetect for warp");
      const warped = det.warpCardFromVideo(canvas, hit2.corners, 110);
      assert(!!warped && warped.width >= 300 && warped.height > warped.width, "warp output size ok");

      log("ALL TESTS PASSED", "ok");
      document.title = "PASS";
      document.body.dataset.result = "PASS";
    } catch (e) {
      log(String(e && e.stack || e), "ng");
      document.title = "FAIL";
      document.body.dataset.result = "FAIL";
    }
  </script>
</body>
</html>
