<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ILLIT Trade (ILLIT交換) - 手数料0円のファン専用安心トレカ・シリアル交換</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            illit: {
              purple: '#b794f4',
              pink: '#fbb6ce',
              darkPurple: '#6b46c1',
              accent: '#9f7aea',
              bg: '#faf5ff',
              softPink: '#fff5f7'
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-illit-bg text-gray-800 min-h-screen font-sans">

  <!-- ヘッダーエリア -->
  <header class="bg-white border-b border-purple-100 sticky top-0 z-50 shadow-sm">
    <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <span class="bg-illit-purple text-white font-bold text-xs px-2 py-1 rounded-full">ILLIT</span>
        <h1 class="text-xl font-bold bg-gradient-to-r from-illit-darkPurple to-illit-accent bg-clip-text text-transparent">
          ILLIT Trade
        </h1>
      </div>

      <!-- ログイン状態表示・操作エリア -->
      <div id="auth-container" class="flex items-center space-x-3">
        <button id="login-btn" onclick="loginWithGoogle()" class="bg-illit-purple hover:bg-illit-darkPurple text-white text-xs md:text-sm font-bold py-2 px-4 rounded-full transition shadow-sm">
          Googleでログイン
        </button>
        <div id="user-profile" class="hidden flex items-center space-x-2">
          <span class="text-xs bg-purple-100 text-illit-darkPurple font-bold px-2 py-0.5 rounded-full" id="new-user-badge">新規</span>
          <span id="user-name" class="text-xs md:text-sm font-semibold text-gray-700"></span>
          <button onclick="logout()" class="text-xs text-gray-400 hover:text-gray-600 underline">ログアウト</button>
        </div>
      </div>
    </div>
  </header>

  <!-- メインコンテンツエリア -->
  <main class="max-w-4xl mx-auto px-4 py-6 space-y-6">

    <!-- サイト趣旨案内バナー -->
    <section class="bg-white p-4 md:p-6 rounded-2xl border border-purple-100 shadow-sm">
      <div class="flex items-start space-x-3">
        <div class="text-2xl">🤝</div>
        <div>
          <h2 class="font-bold text-base md:text-lg text-gray-900">ファン同士で安心・安全に直接トレカ交換</h2>
          <p class="text-xs md:text-sm text-gray-600 mt-1">
            ILLITファンのための手数料0円交換プラットフォームです。相互発送確認と詐欺防止ロジックで安心な取引をサポートします。
          </p>
        </div>
      </div>
    </section>

    <!-- メンバー選択・検索フィルター -->
    <section class="bg-white p-4 md:p-6 rounded-2xl border border-purple-100 shadow-sm space-y-4">
      <h3 class="font-bold text-sm text-gray-700">メンバーで絞り込む</h3>
      <div class="flex flex-wrap gap-2">
        <button class="member-btn bg-purple-50 hover:bg-purple-100 text-illit-darkPurple font-medium text-xs md:text-sm px-3 py-1.5 rounded-full border border-purple-200 transition">全メンバー</button>
        <button class="member-btn bg-gray-50 hover:bg-purple-50 text-gray-600 font-medium text-xs md:text-sm px-3 py-1.5 rounded-full border border-gray-200 transition">ウォニ (Wonhee)</button>
        <button class="member-btn bg-gray-50 hover:bg-purple-50 text-gray-600 font-medium text-xs md:text-sm px-3 py-1.5 rounded-full border border-gray-200 transition">ミンジュ (Minju)</button>
        <button class="member-btn bg-gray-50 hover:bg-purple-50 text-gray-600 font-medium text-xs md:text-sm px-3 py-1.5 rounded-full border border-gray-200 transition">イロハ (Iroha)</button>
        <button class="member-btn bg-gray-50 hover:bg-purple-50 text-gray-600 font-medium text-xs md:text-sm px-3 py-1.5 rounded-full border border-gray-200 transition">モカ (Moka)</button>
        <button class="member-btn bg-gray-50 hover:bg-purple-50 text-gray-600 font-medium text-xs md:text-sm px-3 py-1.5 rounded-full border border-gray-200 transition">ユナ (Yuna)</button>
      </div>
    </section>

    <!-- 出品一覧（ダミー表示） -->
    <section class="space-y-4">
      <div class="flex justify-between items-center px-1">
        <h3 class="font-bold text-base text-gray-800">最新の交換募集</h3>
        <span class="text-xs text-gray-500">手数料 0円</span>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <!-- カード1 -->
        <div class="bg-white p-4 rounded-2xl border border-purple-100 shadow-sm flex flex-col justify-between space-y-3">
          <div class="flex items-center space-x-2">
            <span class="bg-pink-100 text-pink-700 text-xs font-bold px-2 py-0.5 rounded">譲</span>
            <span class="font-bold text-sm text-gray-800">ミンジュ (SUPER REAL ME Ver.)</span>
          </div>
          <div class="flex items-center space-x-2">
            <span class="bg-purple-100 text-illit-darkPurple text-xs font-bold px-2 py-0.5 rounded">求</span>
            <span class="font-bold text-sm text-gray-800">ウォニ (同種)</span>
          </div>
          <div class="pt-2 border-t border-gray-100 flex justify-between items-center text-xs text-gray-500">
            <span>出品者: ユーザーA <span class="bg-gray-100 text-gray-600 px-1.5 py-0.5 rounded">新規</span></span>
            <button class="bg-illit-purple text-white font-bold px-3 py-1.5 rounded-lg hover:bg-illit-darkPurple transition">詳細を見る</button>
          </div>
        </div>
      </div>
    </section>

  </main>

  <!-- Firebase Auth スクリプト -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    // ★ ご自身のFirebaseプロジェクトの設定値に書き換えてください
    const firebaseConfig = {
      apiKey: "ここにAPIキー",
      authDomain: "ここに認証ドメイン",
      projectId: "ここにプロジェクトID",
      storageBucket: "ここにストレージバケット",
      messagingSenderId: "ここにメッセージ送信者ID",
      appId: "ここにアプリID"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    // ログイン関数
    window.loginWithGoogle = function() {
      signInWithPopup(auth, provider)
        .then((result) => {
          console.log("ログイン成功:", result.user);
        })
        .catch((error) => {
          console.error("ログインエラー:", error);
          alert("ログインできませんでした: " + error.message);
        });
    };

    // ログアウト関数
    window.logout = function() {
      signOut(auth).then(() => {
        console.log("ログアウト完了");
      });
    };

    // ログイン状態の監視
    onAuthStateChanged(auth, (user) => {
      const loginBtn = document.getElementById("login-btn");
      const userProfile = document.getElementById("user-profile");
      const userName = document.getElementById("user-name");

      if (user) {
        if (loginBtn) loginBtn.classList.add("hidden");
        if (userProfile) userProfile.classList.remove("hidden");
        if (userName) userName.innerText = user.displayName || "ユーザー";
      } else {
        if (loginBtn) loginBtn.classList.remove("hidden");
        if (userProfile) userProfile.classList.add("hidden");
      }
    });
  </script>
</body>
</html>
