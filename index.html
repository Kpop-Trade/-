<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ILLIT Trade (ILLIT交換) - 手数料0円のファン専用安心トレカ・シリアル交換</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            illit: {
              purple: '#b794f4',
              pink: '#fbb6ce',
              darkPurple: '#6b46c1',
              accent: '#9f7aea',
              bg: '#faf5ff',
              softPink: '#fff5f7'
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-illit-bg text-gray-800 min-h-screen font-sans">

  <!-- ヘッダーエリア -->
  <header class="bg-white border-b border-purple-100 sticky top-0 z-50 shadow-sm">
    <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <span class="bg-illit-purple text-white font-bold text-xs px-2 py-1 rounded-full">ILLIT</span>
        <h1 class="text-xl font-bold bg-gradient-to-r from-illit-darkPurple to-illit-accent bg-clip-text text-transparent">
          ILLIT Trade
        </h1>
      </div>

      <!-- ログイン状態表示・操作エリア -->
      <div id="auth-container" class="flex items-center space-x-3">
        <button id="login-btn" onclick="loginWithGoogle()" class="bg-illit-purple hover:bg-illit-darkPurple text-white text-xs md:text-sm font-bold py-2 px-4 rounded-full transition shadow-sm">
          Googleでログイン
        </button>
        <div id="user-profile" class="hidden flex items-center space-x-2">
          <span class="text-xs bg-purple-100 text-illit-darkPurple font-bold px-2 py-0.5 rounded-full" id="new-user-badge">新規</span>
          <span id="user-name" class="text-xs md:text-sm font-semibold text-gray-700"></span>
          <button onclick="logout()" class="text-xs text-gray-400 hover:text-gray-600 underline">ログアウト</button>
        </div>
      </div>
    </div>
  </header>

  <!-- メインコンテンツエリア -->
  <main class="max-w-4xl mx-auto px-4 py-6 space-y-6">

    <!-- サイト趣旨案内バナー -->
    <section class="bg-white p-4 md:p-6 rounded-2xl border border-purple-100 shadow-sm">
      <div class="flex items-start space-x-3">
        <div class="text-2xl">🤝</div>
        <div>
          <h2 class="font-bold text-base md:text-lg text-gray-900">ファン同士で安心・安全に直接トレカ交換</h2>
          <p class="text-xs md:text-sm text-gray-600 mt-1">
            ILLITファンのための手数料0円交換プラットフォームです。相互発送確認と詐欺防止ロジックで安心な取引をサポートします。
          </p>
        </div>
      </div>
    </section>

    <!-- 出品ボタンエリア -->
    <section class="bg-gradient-to-r from-purple-500 to-illit-accent p-4 md:p-6 rounded-2xl text-white shadow-sm flex justify-between items-center">
      <div>
        <h3 class="font-bold text-base md:text-lg">トレカやシリアルコードを交換に出す</h3>
        <p class="text-xs text-purple-100 mt-0.5">手数料完全無料！ファン同士でスムーズにトレード</p>
      </div>
      <button onclick="openPostModal()" class="bg-white text-illit-darkPurple font-bold text-xs md:text-sm px-4 py-2.5 rounded-xl shadow hover:bg-purple-50 transition">
        ＋ 新規出品する
      </button>
    </section>

    <!-- 出品一覧セクション -->
    <section class="space-y-4">
      <div class="flex justify-between items-center px-1">
        <h3 class="font-bold text-base text-gray-800">最新の交換募集</h3>
        <span class="text-xs text-gray-500">手数料 0円</span>
      </div>

      <!-- データベースから取得したカードがここに並びます -->
      <div id="posts-container" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <p class="text-xs text-gray-400 col-span-2 text-center py-4">読み込み中...</p>
      </div>
    </section>

  </main>

  <!-- 新規出品モーダル -->
  <div id="post-modal" class="fixed inset-0 bg-black/50 hidden z-50 flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-md rounded-2xl p-6 space-y-4 shadow-xl">
      <div class="flex justify-between items-center border-b pb-3">
        <h3 class="font-bold text-base text-gray-800">新規トレカ交換の出品</h3>
        <button onclick="closePostModal()" class="text-gray-400 hover:text-gray-600 font-bold text-lg">×</button>
      </div>
      
      <div class="space-y-3 text-xs md:text-sm">
        <div>
          <label class="block font-semibold text-gray-700 mb-1">対象メンバー</label>
          <select id="input-member" class="w-full border border-gray-200 rounded-xl p-2.5 bg-gray-50">
            <option value="ウォニ (Wonhee)">ウォニ (Wonhee)</option>
            <option value="ミンジュ (Minju)">ミンジュ (Minju)</option>
            <option value="イロハ (Iroha)">イロハ (Iroha)</option>
            <option value="モカ (Moka)">モカ (Moka)</option>
            <option value="ユナ (Yuna)">ユナ (Yuna)</option>
          </select>
        </div>

        <div>
          <label class="block font-semibold text-gray-700 mb-1">【譲】（出すもの）</label>
          <input type="text" id="input-give" placeholder="例: SUPER REAL ME トレカ" class="w-full border border-gray-200 rounded-xl p-2.5 bg-gray-50">
        </div>

        <div>
          <label class="block font-semibold text-gray-700 mb-1">【求】（希望するもの）</label>
          <input type="text" id="input-want" placeholder="例: 同種 ウォニ または シリアル" class="w-full border border-gray-200 rounded-xl p-2.5 bg-gray-50">
        </div>
      </div>

      <div class="flex space-x-2 pt-2">
        <button onclick="closePostModal()" class="flex-1 bg-gray-100 text-gray-600 font-bold py-2.5 rounded-xl hover:bg-gray-200 transition">キャンセル</button>
        <button onclick="submitPost()" class="flex-1 bg-illit-purple text-white font-bold py-2.5 rounded-xl hover:bg-illit-darkPurple transition">出品する</button>
      </div>
    </div>
  </div>

  <!-- 詳細・連絡モーダル -->
  <div id="detail-modal" class="fixed inset-0 bg-black/50 hidden z-50 flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-md rounded-2xl p-6 space-y-4 shadow-xl">
      <div class="flex justify-between items-center border-b pb-3">
        <h3 class="font-bold text-base text-gray-800">交換募集の詳細</h3>
        <button onclick="closeDetailModal()" class="text-gray-400 hover:text-gray-600 font-bold text-lg">×</button>
      </div>
      
      <div class="space-y-3 text-xs md:text-sm">
        <div class="bg-purple-50 p-3 rounded-xl space-y-2">
          <div><span class="font-bold text-gray-500">メンバー:</span> <span id="detail-member" class="font-semibold text-gray-800"></span></div>
          <div><span class="bg-pink-100 text-pink-700 text-xs font-bold px-2 py-0.5 rounded">譲</span> <span id="detail-give" class="font-bold text-gray-800 ml-1"></span></div>
          <div><span class="bg-purple-100 text-illit-darkPurple text-xs font-bold px-2 py-0.5 rounded">求</span> <span id="detail-want" class="font-bold text-gray-800 ml-1"></span></div>
        </div>
        <div>
          <span class="font-semibold text-gray-700">出品者:</span> <span id="detail-user" class="text-gray-600"></span>
        </div>
        <p class="text-gray-500 text-xs bg-gray-50 p-3 rounded-xl">
          💡 交換を行う際は、お互いのトレカの状態や発送方法（スリーブ・硬質ケース・防水対策など）をよく確認してから進めてください。
        </p>
      </div>

      <div class="pt-2">
        <button onclick="closeDetailModal()" class="w-full bg-illit-purple text-white font-bold py-2.5 rounded-xl hover:bg-illit-darkPurple transition">閉じる</button>
      </div>
    </div>
  </div>

  <!-- Firebase & アプリケーションロジック -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, getDocs, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // 組み込み済みのFirebase設定
    const firebaseConfig = {
      apiKey: "AIzaSyBB1_QTcXpF0Ap72tDaf5_CCUtNBwSlXCs",
      authDomain: "illit-7ecd4.firebaseapp.com",
      projectId: "illit-7ecd4",
      storageBucket: "illit-7ecd4.firebasestorage.app",
      messagingSenderId: "1060277997826",
      appId: "1:1060277997826:web:e47d21d9edc538bb86321b",
      measurementId: "G-4GYW6WCS6J"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    let currentUser = null;

    // ログイン関数
    window.loginWithGoogle = function() {
      signInWithPopup(auth, provider).catch((error) => {
        alert("ログインエラー: " + error.message);
      });
    };

    // ログアウト関数
    window.logout = function() {
      signOut(auth);
    };

    // ログイン状態の監視
    onAuthStateChanged(auth, (user) => {
      currentUser = user;
      const loginBtn = document.getElementById("login-btn");
      const userProfile = document.getElementById("user-profile");
      const userName = document.getElementById("user-name");

      if (user) {
        if (loginBtn) loginBtn.classList.add("hidden");
        if (userProfile) userProfile.classList.remove("hidden");
        if (userName) userName.innerText = user.displayName || "ユーザー";
      } else {
        if (loginBtn) loginBtn.classList.remove("hidden");
        if (userProfile) userProfile.classList.add("hidden");
      }
    });

    // 新規出品モーダルの開閉
    window.openPostModal = function() {
      if (!currentUser) {
        alert("出品するにはGoogleログインが必要です。");
        return;
      }
      document.getElementById("post-modal").classList.remove("hidden");
    };

    window.closePostModal = function() {
      document.getElementById("post-modal").classList.add("hidden");
    };

    // 詳細モーダルの開閉
    window.openDetailModal = function(give, want, member, userName) {
      document.getElementById("detail-give").innerText = give;
      document.getElementById("detail-want").innerText = want;
      document.getElementById("detail-member").innerText = member;
      document.getElementById("detail-user").innerText = userName;
      document.getElementById("detail-modal").classList.remove("hidden");
    };

    window.closeDetailModal = function() {
      document.getElementById("detail-modal").classList.add("hidden");
    };

    // 出品データをFirestoreに保存する関数
    window.submitPost = async function() {
      const member = document.getElementById("input-member").value;
      const give = document.getElementById("input-give").value;
      const want = document.getElementById("input-want").value;

      if (!give || !want) {
        alert("「譲」と「求」の内容を入力してください。");
        return;
      }

      try {
        await addDoc(collection(db, "posts"), {
          member: member,
          give: give,
          want: want,
          userName: currentUser.displayName || "匿名ファン",
          createdAt: serverTimestamp()
        });

        alert("出品が完了しました！");
        closePostModal();
        document.getElementById("input-give").value = "";
        document.getElementById("input-want").value = "";
        loadPosts(); // リストを再読み込み
      } catch (e) {
        console.error("出品エラー: ", e);
        alert("出品に失敗しました。");
      }
    };

    // Firestoreから出品一覧を読み込んで画面に表示する関数
    async function loadPosts() {
      const container = document.getElementById("posts-container");
      container.innerHTML = '<p class="text-xs text-gray-400 col-span-2 text-center py-4">読み込み中...</p>';

      try {
        const q = query(collection(db, "posts"), orderBy("createdAt", "desc"));
        const querySnapshot = await getDocs(q);

        if (querySnapshot.empty) {
          container.innerHTML = '<p class="text-xs text-gray-400 col-span-2 text-center py-4">現在、出品されているカードはありません。</p>';
          return;
        }

        container.innerHTML = "";
        querySnapshot.forEach((doc) => {
          const data = doc.data();
          const cardHtml = `
            <div class="bg-white p-4 rounded-2xl border border-purple-100 shadow-sm flex flex-col justify-between space-y-3">
              <div class="flex items-center space-x-2">
                <span class="bg-pink-100 text-pink-700 text-xs font-bold px-2 py-0.5 rounded">譲</span>
                <span class="font-bold text-sm text-gray-800">${escapeHtml(data.give)} <span class="text-xs text-gray-400 font-normal">(${escapeHtml(data.member)})</span></span>
              </div>
              <div class="flex items-center space-x-2">
                <span class="bg-purple-100 text-illit-darkPurple text-xs font-bold px-2 py-0.5 rounded">求</span>
                <span class="font-bold text-sm text-gray-800">${escapeHtml(data.want)}</span>
              </div>
              <div class="pt-2 border-t border-gray-100 flex justify-between items-center text-xs text-gray-500">
                <span>出品者: ${escapeHtml(data.userName)} <span class="bg-gray-100 text-gray-600 px-1.5 py-0.5 rounded">新規</span></span>
                <button onclick="openDetailModal('${escapeHtml(data.give).replace(/'/g, "\\'")}', '${escapeHtml(data.want).replace(/'/g, "\\'")}', '${escapeHtml(data.member).replace(/'/g, "\\'")}', '${escapeHtml(data.userName).replace(/'/g, "\\'")}')" class="bg-illit-purple text-white font-bold px-3 py-1.5 rounded-lg hover:bg-illit-darkPurple transition">詳細・連絡</button>
              </div>
            </div>
          `;
          container.innerHTML += cardHtml;
        });
      } catch (e) {
        console.error("読み込みエラー: ", e);
        container.innerHTML = '<p class="text-xs text-red-400 col-span-2 text-center py-4">データの読み込みに失敗しました。</p>';
      }
    }

    // HTMLエスケープ（セキュリティ対策）
    function escapeHtml(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }

    // ページを開いたときに出品一覧を読み込む
    loadPosts();
  </script>
</body>
</html>
