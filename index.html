<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ILLIT Trade</title>
<script>
(async function () {
  try {
    var parts = await Promise.all([
      fetch('./index.part0.html?v=1', { cache: 'no-store' }).then(function (r) { return r.text(); }),
      fetch('./index.part1.html?v=1', { cache: 'no-store' }).then(function (r) { return r.text(); }),
      fetch('./index.part2.html?v=1', { cache: 'no-store' }).then(function (r) { return r.text(); })
    ]);
    var html = parts.join('');
    document.open();
    document.write(html);
    document.close();
  } catch (e) {
    document.body.innerHTML = '<p style="padding:2rem">読み込み失敗: ' + e + '</p>';
  }
})();
</script>
</head>
<body style="font-family:sans-serif;padding:2rem;text-align:center">ILLIT Trade を復元中…</body>
</html>
