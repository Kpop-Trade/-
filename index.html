<!DOCTYPE html>
<html lang="ja">
<head><script>(function(){let st=null,gm="2x3",gCnt=6,gBoxes=[],torchOn=false;const mkBoxes=m=>{const[r,c]=m.split("x").map(Number),ar=4/3,cardRatio=1.55,gx=2.5,gy=3.2,maxW=(86-gx*(c-1))/c,maxH=(86-gy*(r-1))/r;let cw=maxW,ch=cw*ar*cardRatio;if(ch>maxH){ch=maxH;cw=ch/(ar*cardRatio);}cw=+cw.toFixed(2);ch=+ch.toFixed(2);const totW=cw*c+gx*(c-1),totH=ch*r+gy*(r-1),sx=(100-totW)/2,sy=(100-totH)/2,res=[];for(let i=0;i<r;i++)for(let j=0;j<c;j++)res.push({x:+(sx+j*(cw+gx)).toFixed(2),y:+(sy+i*(ch+gy)).toFixed(2),w:cw,h:ch,r:0});return res.slice(0,gCnt);};const drawG=()=>{const ov=document.getElementById("guide-cam-ov");if(!ov)return;gBoxes=mkBoxes(gm);ov.innerHTML=gBoxes.map((v,i)=>"<div style=\"position:absolute;left:"+v.x+"%;top:"+v.y+"%;width:"+v.w+"%;height:"+v.h+"%;border:2px dashed #22d3ee;background:rgba(34,211,238,0.12);border-radius:6px\"><span style=\"position:absolute;top:2px;left:4px;background:#000a;color:#fff;font-size:10px;padding:0 4px;border-radius:4px\">#"+(i+1)+"</span></div>").join("");};const startCam=async()=>{const vd=document.getElementById("guide-cam-vid"),msg=document.getElementById("cam-start-msg");if(!vd)return;if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)return alert("カメラ許可が必要です");try{try{st=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"},audio:false});}catch(_){st=await navigator.mediaDevices.getUserMedia({video:true,audio:false});}vd.srcObject=st;vd.setAttribute("playsinline","");vd.muted=true;await vd.play();if(msg)msg.style.display="none";drawG();}catch(e){alert("カメラ起動エラー: "+e.message);}};document.addEventListener("input",e=>{if(e.target&&e.target.id==="cam-bright"){const v=e.target.value,vd=document.getElementById("guide-cam-vid"),vl=document.getElementById("cam-bright-val");if(vl)vl.textContent=v+"%";if(vd)vd.style.filter="brightness("+v+"%) contrast(104%)";}});document.addEventListener("click",async e=>{const gBtn=e.target.closest("#cam-grid-btns button");if(gBtn){gm=gBtn.dataset.g;const[rr,cc]=gm.split("x").map(Number);gCnt=rr*cc;document.querySelectorAll("#cam-grid-btns button").forEach(x=>x.className=x===gBtn?"px-2 py-0.5 rounded bg-purple-600 font-bold":"px-2 py-0.5 rounded bg-white/15 font-bold");drawG();return;}if(e.target.closest("#manual-cam-start")){e.preventDefault();e.stopPropagation();startCam();return;}if(e.target.closest("#cam-torch-btn")){if(!st)return alert("先にカメラを起動してください");const tr=st.getVideoTracks()[0];if(!tr)return;try{torchOn=!torchOn;await tr.applyConstraints({advanced:[{torch:torchOn}]});const tb=document.getElementById("cam-torch-btn");if(tb)tb.className=torchOn?"px-2 py-0.5 rounded bg-yellow-400 text-black font-bold":"px-2 py-0.5 rounded bg-white/15 font-bold";}catch(err){alert("ライト非対応です");}return;}if(e.target.closest("#snap-guide-cam")){const vd=document.getElementById("guide-cam-vid"),brSl=document.getElementById("cam-bright");if(!vd||!vd.videoWidth)return alert("先にカメラを起動してください");if(!gBoxes.length)drawG();const cv=document.createElement("canvas");cv.width=vd.videoWidth;cv.height=vd.videoHeight;const cx=cv.getContext("2d");cx.filter="brightness("+(brSl?brSl.value:115)+"%) contrast(104%)";cx.drawImage(vd,0,0);window.__presetGuideBoxes=JSON.parse(JSON.stringify(gBoxes));cv.toBlob(bl=>{const f=new File([bl],"guide_shot.jpg",{type:"image/jpeg"}),dt=new DataTransfer();dt.items.add(f);const inp=document.querySelector("input[type=file]");if(inp){inp.files=dt.files;inp.dispatchEvent(new Event("change",{bubbles:true}));}alert("撮影しました！切り抜き処理に渡します");},"image/jpeg",0.92);}});setTimeout(drawG,300);})();</script></body>
</html>
